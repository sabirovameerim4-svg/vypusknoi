<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Умный Темный Google</title>
    <style>
      /* Базовые стили для темной темы */
      body {
        background-color: #121212;
        color: #ffffff;
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }

      .search-container {
        text-align: center;
        transition: all 0.5s ease;
        z-index: 10;
      }

      /* Минималистичная иконка Google */
      .google-icon {
        font-size: 80px;
        font-weight: 900;
        margin-bottom: 25px;
        background: linear-gradient(45deg, #4285f4, #ea4335, #fbbc05, #34a853);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        user-select: none;
      }

      /* Поисковая строка */
      .search-box-wrapper {
        position: relative;
        display: inline-block;
      }

      .search-box {
        width: 550px;
        max-width: 90vw;
        padding: 15px 25px;
        font-size: 18px;
        border-radius: 30px;
        border: 2px solid #333;
        background-color: #1e1e1e;
        color: white;
        outline: none;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      .search-box:focus {
        border-color: #4285f4;
        box-shadow: 0 4px 20px rgba(66, 133, 244, 0.4);
      }

      /* Панель подсказок/приложений под строкой */
      .apps-panel {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background-color: #1e1e1e;
        border: 2px solid #333;
        border-top: none;
        border-radius: 0 0 20px 20px;
        margin-top: -10px;
        padding: 20px 15px 15px 15px;
        display: none;
        gap: 15px;
        justify-content: center;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        z-index: 5;
      }

      .apps-panel.show {
        display: flex;
      }

      /* Кнопки приложений */
      .app-btn {
        background-color: #2a2a2a;
        border: 1px solid #444;
        color: white;
        padding: 12px 20px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
        flex: 1;
        justify-content: center;
      }

      .app-btn:hover {
        background-color: #4285f4;
        border-color: #4285f4;
        transform: scale(1.03);
      }

      /* Окна для встроенных приложений (Модальные окна) */
      .app-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        z-index: 100;
        justify-content: center;
        align-items: center;
      }

      .app-window {
        background-color: #1e1e1e;
        border-radius: 20px;
        width: 500px;
        max-width: 90vw;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        position: relative;
        border: 2px solid #333;
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        color: #888;
        font-size: 28px;
        cursor: pointer;
        transition: color 0.2s;
      }

      .close-btn:hover {
        color: #ea4335;
      }
      /* --- СТИЛИ ДЛЯ ИГРЫ (Блок Бласт) --- */
      #game-canvas {
        background-color: #0d0d0d;
        display: block;
        margin: 15px auto 0 auto;
        border-radius: 10px;
        border: 1px solid #333;
      }
      .game-score {
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        color: #fbbc05;
        margin-bottom: 5px;
      }

      /* --- СТИЛИ ДЛЯ ПЕРЕВОДЧИКА --- */
      .translator-box {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 15px;
      }
      .lang-select {
        background: #2a2a2a;
        color: white;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #444;
        font-size: 16px;
        cursor: pointer;
      }
      .trans-textarea {
        width: 100%;
        box-sizing: border-box;
        height: 90px;
        background: #0d0d0d;
        color: white;
        border: 1px solid #333;
        padding: 12px;
        border-radius: 10px;
        resize: none;
        font-size: 16px;
      }
      .trans-textarea:focus {
        border-color: #34a853;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="search-container">
      <div class="google-icon">G</div>

      <div class="search-box-wrapper">
        <input
          type="text"
          class="search-box"
          id="searchBox"
          placeholder="Введите: youtube, игра или переводчик..."
          autocomplete="off"
        />

        <div class="apps-panel" id="appsPanel">
          <button class="app-btn" onclick="executeSearch('youtube')">
            📺 YouTube
          </button>
          <button class="app-btn" onclick="executeSearch('игра')">
            🎮 Блок Бласт
          </button>
          <button class="app-btn" onclick="executeSearch('переводчик')">
            🌐 Переводчик
          </button>
        </div>
      </div>
    </div>

    <div class="app-overlay" id="gameModal">
      <div class="app-window">
        <button class="close-btn" onclick="closeApp('gameModal')">
          &times;
        </button>
        <h3 style="margin-top: 0; text-align: center; color: #fbbc05">
          Мини Блок Бласт
        </h3>
        <div class="game-score">Счет: <span id="score">0</span></div>
        <canvas id="game-canvas" width="240" height="400"></canvas>
        <p
          style="
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 10px;
          "
        >
          Управление стрелочками: ◀ ▶ движение, ▲ поворот, ▼ ускорить.
        </p>
      </div>
    </div>

    <div class="app-overlay" id="translateModal">
      <div class="app-window">
        <button class="close-btn" onclick="closeApp('translateModal')">
          &times;
        </button>
        <h3 style="margin-top: 0; text-align: center; color: #34a853">
          Словарь-Переводчик
        </h3>

        <div class="translator-box">
          <select
            class="lang-select"
            id="langDirection"
            onchange="clearTranslation()"
          >
            <option value="en-ru">Английский ➔ Русский</option>
            <option value="ru-en">Русский ➔ Английский</option>
          </select>

          <textarea
            class="trans-textarea"
            id="sourceText"
            placeholder="Введите слово для перевода..."
            oninput="simpleTranslate()"
          ></textarea>
          <textarea
            class="trans-textarea"
            id="targetText"
            placeholder="Перевод отобразится здесь..."
            readonly
          ></textarea>
        </div>
      </div>
    </div>

    <script>
      const searchBox = document.getElementById('searchBox');
      const appsPanel = document.getElementById('appsPanel');

      // Показываем панель приложений, когда пользователь нажимает на строку
      searchBox.addEventListener('focus', () => {
          appsPanel.classList.add('show');
          searchBox.style.borderRadius = "20px 20px 0 0"; // Скругляем только верх поисковой строки
      });
      // Скрываем панель, если кликнули вне поиска
      document.addEventListener('click', (e) => {
          if (!searchBox.contains(e.target) && !appsPanel.contains(e.target)) {
              appsPanel.classList.remove('show');
              searchBox.style.borderRadius = "30px";
          }
      });

      // ОТСЛЕЖИВАНИЕ НАЖАТИЯ ENTER В СТРОКЕ
      searchBox.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
              const query = searchBox.value.toLowerCase().trim();
              executeSearch(query);
          }
      });

      // ГЛАВНАЯ ФУНКЦИЯ ДЛЯ ВЫЗОВА САЙТОВ ПО ЗАПРОСУ
      function executeSearch(query) {
          appsPanel.classList.remove('show');
          searchBox.style.borderRadius = "30px";

          if (query.includes('youtube') || query.includes('ютуб')) {
              window.open('https://www.youtube.com', '_blank'); // Открывает YouTube в новой вкладке
          }
          else if (query.includes('игра')  query.includes('game')  query.includes('блок')) {
              openApp('gameModal'); // Открывает встроенную игру
          }
          else if (query.includes('переводчик')  query.includes('translate')  query.includes('перевод')) {
              openApp('translateModal'); // Открывает встроенный переводчик
          }
          else if (query !== "") {
              // Если ввели что-то другое, просто ищет это в настоящем Google
              window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
          }
      }

      // Логика открытия/закрытия окон
      function openApp(id) {
          document.getElementById(id).style.display = 'flex';
          if(id === 'gameModal') { startGame(); }
      }

      function closeApp(id) {
          document.getElementById(id).style.display = 'none';
          if(id === 'gameModal') { stopGame(); }
          searchBox.value = ""; // Очищаем строку после закрытия
      }

      // --- КОД СЛОВАРЯ-ПЕРЕВОДЧИКА (Двунаправленный) ---
      const dictionary = {
          // Английский -> Русский
          "hello": "привет", "world": "мир", "cat": "кот / кошка", "dog": "собака",
          "apple": "яблоко", "game": "игра", "book": "книга", "laptop": "ноутбук",
          "google": "гугл", "translator": "переводчик", "friend": "друг", "love": "любовь",
          "house": "дом", "water": "вода", "school": "школа", "time": "время",
          // Русский -> Английский
          "привет": "hello", "мир": "world", "кот": "cat", "кошка": "cat", "собака": "dog",
          "яблоко": "apple", "игра": "game", "книга": "book", "ноутбук": "laptop",
          "друг": "friend", "любовь": "love", "дом": "house", "вода": "water", "школа": "school"
      };

      function simpleTranslate() {
          const text = document.getElementById('sourceText').value.toLowerCase().trim();
          const direction = document.getElementById('langDirection').value;
          const target = document.getElementById('targetText');

          if (text === "") {
              target.value = "";
              return;
          }

          if (dictionary[text]) {
              target.value = dictionary[text];
          } else {
              if(direction === "en-ru") {
                  target.value = "Слово не найдено в демо-базе. Попробуйте: hello, cat, laptop, world, game.";
              } else {
                  target.value = "Word not found in demo base. Try: привет, игра, кот, ноутбук, мир.";
              }
          }
      }

      function clearTranslation() {
          document.getElementById('sourceText').value = "";
          document.getElementById('targetText').value = "";
      }

      // --- КОД ИГРЫ ТЕТРИС / БЛОК БЛАСТ ---
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      let gameInterval;
      let score = 0;
      const ROW = 20; const COL = 12; const SQ = 20; const VACANT = "#0d0d0d";
      let board = [];

      function initBoard() {
          for(r = 0; r < ROW; r++){
              board[r] = [];
              for(c = 0; c < COL; c++){ board[r][c] = VACANT; }
          }
      }

      function drawSquare(x, y, color){
          ctx.fillStyle = color;
          ctx.fillRect(x*SQ, y*SQ, SQ, SQ);
          ctx.strokeStyle = "#1a1a1a";
          ctx.strokeRect(x*SQ, y*SQ, SQ, SQ);
      }

      function drawBoard(){
          for(r = 0; r < ROW; r++){
              for(c = 0; c < COL; c++){ drawSquare(c, r, board[r][c]); }
          }
      }

      const PIECES = [
          [[[1,1,1,1]], "#4285F4"],
          [[[1,1],[1,1]], "#EA4335"],
          [[[0,1,0],[1,1,1]], "#FBBC05"],
          [[[1,1,0],[0,1,1]], "#34A853"]
      ];

      let activePiece;

      function Piece(tetromino, color){
          this.tetromino = tetromino;
          this.color = color;
          this.tetrominoN = 0;
          this.activeTetromino = this.tetromino[this.tetrominoN];
          this.x = 4; this.y = -1;
      }

      Piece.prototype.draw = function(){
          for(r = 0; r < this.activeTetromino.length; r++){
              for(c = 0; c < this.activeTetromino[r].length; c++){
                  if(this.activeTetromino[r][c]){ drawSquare(this.x + c, this.y + r, this.color); }
              }
          }
      }

      Piece.prototype.unDraw = function(){
          for(r = 0; r < this.activeTetromino.length; r++){
              for(c = 0; c < this.activeTetromino[r].length; c++){
                  if(this.activeTetromino[r][c]){ drawSquare(this.x + c, this.y + r, VACANT); }
              }
          }
      }

      Piece.prototype.moveDown = function(){
          if(!this.collision(0, 1, this.activeTetromino)){
              this.unDraw(); this.y++; this.draw();
          } else {
              this.lock(); activePiece = randomPiece();
          }
      }

      Piece.prototype.moveRight = function(){
          if(!this.collision(1, 0, this.activeTetromino)){ this.unDraw(); this.x++; this.draw(); }
      }

      Piece.prototype.moveLeft = function(){
          if(!this.collision(-1, 0, this.activeTetromino)){ this.unDraw(); this.x--; this.draw(); }
      }

      Piece.prototype.rotate = function(){
          // Простейший разворот матрицы для демонстрации
          let nextPattern = this.activeTetromino[0] && this.activeTetromino.map((val, index) => this.activeTetromino.map(row => row[index]).reverse());
          if(nextPattern && !this.collision(0,0, nextPattern)){
              this.unDraw();
              this.activeTetromino = nextPattern;
              this.draw();
          }
      }

      Piece.prototype.collision = function(x, y, piece){
          for(r = 0; r < piece.length; r++){
              for(c = 0; c < piece[r].length; c++){
                  if(!piece[r][c]){ continue; }
                  let newX = this.x + c + x; let newY = this.y + r + y;
                  if(newX < 0  newX >= COL  newY >= ROW){ return true; }
                  if(newY < 0){ continue; }
                  if(board[newY][newX] !== VACANT){ return true; }
              }
          }
          return false;
      }

      Piece.prototype.lock = function(){
          for(r = 0; r < this.activeTetromino.length; r++){
              for(c = 0; c < this.activeTetromino[r].length; c++){
                  if(!this.activeTetromino[r][c]){ continue; }
                  if(this.y + r < 0){
                      alert("Игра окончена! Счет: " + score);
                      initBoard(); score = 0;
                      document.getElementById('score').innerText = score;
                      break;
                  }
                  board[this.y+r][this.x+c] = this.color;
              }
          }
          for(r = 0; r < ROW; r++){
              let isRowFull = true;
              for(c = 0; c < COL; c++){ if(board[r][c] === VACANT){ isRowFull = false; } }
              if(isRowFull){
                  for(y = r; y > 1; y--){
                      for(c = 0; c < COL; c++){ board[y][c] = board[y-1][c]; }
                  }
                  for(c = 0; c < COL; c++){ board[0][c] = VACANT; }
                  score += 10; document.getElementById('score').innerText = score;
              }
          }
          drawBoard();
      }

      function randomPiece(){
          let r = Math.floor(Math.random() * PIECES.length);
          return new Piece(PIECES[r][0], PIECES[r][1]);
      }

      document.addEventListener("keydown", CONTROL);
      function CONTROL(event){
          if(document.getElementById('gameModal').style.display === 'flex') {
              if(event.keyCode == 37){ activePiece.moveLeft(); }
              else if(event.keyCode == 38){ activePiece.rotate(); }
              else if(event.keyCode == 39){ activePiece.moveRight(); }
              else if(event.keyCode == 40){ activePiece.moveDown(); }
          }
      }

      function startGame() {
          initBoard(); drawBoard();
          activePiece = randomPiece(); activePiece.draw();
          clearInterval(gameInterval);
          gameInterval = setInterval(() => activePiece.moveDown(), 400);
      }

      function stopGame() { clearInterval(gameInterval); }
    </script>
  </body>
</html>
